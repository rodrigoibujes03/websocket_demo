<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      background: #1F3864;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }
    .header-info h2 { font-size: 15px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.7; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      background: rgba(255,255,255,0.15);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; transition: background 0.3s; }
    .dot.online { background: #2ECC71; }

    /* PANEL DE CONEXIÓN */
    .connection-panel {
      background: white;
      border-bottom: 1px solid #e8e8e8;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .connection-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .connection-label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      white-space: nowrap;
    }
    .connection-row input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.2s;
      background: #f8f8f8;
      color: #333;
    }
    .connection-row input[type="text"]:focus { border-color: #1F3864; background: white; }
    .connection-row input[type="text"]:disabled { color: #888; background: #f0f0f0; cursor: not-allowed; }

    .btn-connect {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .btn-connect.connect { background: #1F3864; color: white; }
    .btn-connect.connect:hover { background: #16305a; }
    .btn-connect.disconnect { background: #e74c3c; color: white; }
    .btn-connect.disconnect:hover { background: #c0392b; }
    .btn-connect:active { transform: scale(0.96); }

    .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .name-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      background: #f8f8f8;
    }
    .name-row input:focus { border-color: #1F3864; background: white; }
    .name-row input:disabled { color: #888; background: #f0f0f0; cursor: not-allowed; }

    /* MENSAJES */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    /* BURBUJAS */
    .bubble {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 80%;
    }
    .bubble.mine { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #1F3864;
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .bubble.mine .avatar { background: #2E86AB; }

    .content {
      background: white;
      border-radius: 16px 16px 16px 4px;
      padding: 8px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      max-width: calc(100% - 40px);
      word-break: break-word;
    }
    .bubble.mine .content {
      background: #1F3864;
      border-radius: 16px 16px 4px 16px;
    }

    .username { font-size: 11px; font-weight: 700; color: #1F3864; margin-bottom: 2px; }
    .bubble.mine .username { color: rgba(255,255,255,0.65); }
    .text { font-size: 14px; color: #1a1a1a; line-height: 1.4; }
    .bubble.mine .text { color: white; }
    .time { font-size: 10px; color: #aaa; margin-top: 3px; text-align: right; }
    .bubble.mine .time { color: rgba(255,255,255,0.5); }

    /* SISTEMA */
    .sys-msg {
      text-align: center;
      font-size: 12px;
      color: #999;
      background: rgba(0,0,0,0.05);
      border-radius: 20px;
      padding: 4px 12px;
      align-self: center;
    }

    /* INPUT */
    .input-area {
      background: white;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #e8e8e8;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      padding: 10px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
      background: #f8f8f8;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: #1F3864; background: white; }
    .input-area input:disabled { background: #f0f0f0; cursor: not-allowed; }
    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #1F3864;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:hover { background: #16305a; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { background: #ccc; cursor: default; }
    .send-btn svg { width: 20px; height: 20px; fill: white; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="header-avatar" id="headerAvatar">WS</div>
      <div class="header-info">
        <h2>Chat en vivo</h2>
        <p id="headerNombre">Sin conectar</p>
      </div>
    </div>
    <div class="status-badge">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Offline</span>
    </div>
  </div>

  <!-- PANEL DE CONEXIÓN -->
  <div class="connection-panel">
    <!-- URL del socket -->
    <div class="connection-row">
      <span class="connection-label">🔌 Socket:</span>
      <input type="text" id="wsUrl"
        value="wss://websocket-server-rodrigo03-dev.apps.rm1.0a51.p1.openshiftapps.com"
        placeholder="wss://tu-servidor..." />
      <button class="btn-connect connect" id="btnConectar" onclick="conectar()">Conectar</button>
      <button class="btn-connect disconnect" id="btnDesconectar" onclick="desconectar()" style="display:none;">Desconectar</button>
    </div>
    <!-- Nombre de usuario -->
    <div class="name-row">
      <span class="connection-label">👤 Nombre:</span>
      <input type="text" id="usernameInput" placeholder="Tu nombre..." maxlength="20" />
    </div>
  </div>

  <!-- MENSAJES -->
  <div class="messages" id="messages"></div>

  <!-- INPUT -->
  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." disabled onkeypress="teclaEnter(event)" />
    <button class="send-btn" id="sendBtn" onclick="enviar()" disabled>
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

  <script>
    let socket;
    let miNombre = '';

    function iniciales(nombre) {
      return nombre.trim().split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
    }

    function horaActual() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function conectar() {
      const url = document.getElementById('wsUrl').value.trim();
      const nombre = document.getElementById('usernameInput').value.trim();

      if (!url) {
        alert('Por favor ingresa la URL del servidor WebSocket.');
        document.getElementById('wsUrl').focus();
        return;
      }
      if (!nombre) {
        alert('Por favor ingresa tu nombre antes de conectarte.');
        document.getElementById('usernameInput').focus();
        return;
      }

      miNombre = nombre;
      document.getElementById('headerAvatar').textContent = iniciales(nombre);
      document.getElementById('headerNombre').textContent = nombre;

      // Deshabilitar controles durante conexión
      document.getElementById('wsUrl').disabled = true;
      document.getElementById('usernameInput').disabled = true;
      document.getElementById('btnConectar').disabled = true;
      mensajeSistema('Conectando a ' + url + '...');

      socket = new WebSocket(url);

      socket.onopen = () => {
        document.getElementById('statusDot').classList.add('online');
        document.getElementById('statusText').textContent = 'Online';
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('btnConectar').style.display = 'none';
        document.getElementById('btnDesconectar').style.display = 'inline-flex';
        document.getElementById('btnConectar').disabled = false;
        mensajeSistema('✅ Conectado como ' + miNombre);
        socket.send(JSON.stringify({ tipo: 'nombre', nombre: miNombre }));
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'welcome') return;
          if (data.tipo === 'chat') {
            agregarBurbuja(data.nombre, data.texto, data.nombre === miNombre);
          } else if (data.tipo === 'sistema') {
            mensajeSistema(data.texto);
          }
        } catch(e) {}
      };

      socket.onclose = (e) => {
        setDesconectado();
        if (e.wasClean) {
          mensajeSistema('🔴 Desconectado del servidor.');
        } else {
          mensajeSistema('⚠️ Conexión perdida. Puedes volver a conectarte.');
        }
      };

      socket.onerror = () => {
        mensajeSistema('❌ Error al conectar. Verifica la URL e inténtalo de nuevo.');
        setDesconectado();
      };
    }

    function desconectar() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.close(1000, 'Usuario se desconectó');
      }
    }

    function setDesconectado() {
      document.getElementById('statusDot').classList.remove('online');
      document.getElementById('statusText').textContent = 'Offline';
      document.getElementById('messageInput').disabled = true;
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('wsUrl').disabled = false;
      document.getElementById('usernameInput').disabled = false;
      document.getElementById('btnConectar').style.display = 'inline-flex';
      document.getElementById('btnDesconectar').style.display = 'none';
      document.getElementById('headerNombre').textContent = 'Sin conectar';
    }

    function enviar() {
      const input = document.getElementById('messageInput');
      const texto = input.value.trim();
      if (!texto || !socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ tipo: 'chat', nombre: miNombre, texto }));
      input.value = '';
      input.focus();
    }

    function teclaEnter(e) {
      if (e.key === 'Enter') enviar();
    }

    function agregarBurbuja(nombre, texto, esMio) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'bubble' + (esMio ? ' mine' : '');
      div.innerHTML = `
        <div class="avatar">${iniciales(nombre)}</div>
        <div class="content">
          <div class="username">${nombre}</div>
          <div class="text">${texto}</div>
          <div class="time">${horaActual()}</div>
        </div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function mensajeSistema(texto) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'sys-msg';
      div.textContent = texto;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }
  </script>
</body>
</html>
