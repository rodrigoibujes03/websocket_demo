<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    .header { background: #1F3864; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header h2 { font-size: 16px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #aaa; }
    .dot.online { background: #2ECC71; }

    /* MODAL DE NOMBRE */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: white; border-radius: 12px; padding: 28px 32px; width: 320px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .modal h3 { font-size: 15px; color: #1F3864; margin-bottom: 16px; }
    .modal input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 12px; }
    .modal input:focus { border-color: #1F3864; }
    .modal button { width: 100%; padding: 11px; background: #1F3864; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal button:hover { background: #16305a; }

    /* CHAT */
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }

    /* BURBUJA — mensaje de otro */
    .bubble { display: flex; align-items: flex-end; gap: 8px; max-width: 70%; }
    .bubble .avatar { width: 32px; height: 32px; border-radius: 50%; background: #1F3864; color: white; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .bubble .content { background: white; border-radius: 12px 12px 12px 2px; padding: 8px 14px; }
    .bubble .username { font-size: 11px; font-weight: 700; color: #1F3864; margin-bottom: 2px; }
    .bubble .text { font-size: 14px; color: #222; }

    /* BURBUJA — mensaje propio */
    .bubble.mine { align-self: flex-end; flex-direction: row-reverse; }
    .bubble.mine .avatar { background: #2E86AB; }
    .bubble.mine .content { background: #1F3864; border-radius: 12px 12px 2px 12px; }
    .bubble.mine .username { color: rgba(255,255,255,0.7); }
    .bubble.mine .text { color: white; }

    /* MENSAJE DE SISTEMA */
    .sys-msg { text-align: center; font-size: 12px; color: #999; padding: 4px 0; }

    /* INPUT AREA */
    .input-area { background: white; padding: 12px 16px; display: flex; gap: 10px; border-top: 1px solid #e0e0e0; }
    .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: #1F3864; }
    .input-area button { padding: 10px 22px; background: #1F3864; color: white; border: none; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .input-area button:hover { background: #16305a; }
    .input-area button:disabled { background: #bbb; cursor: default; }
  </style>
</head>
<body>

  <!-- MODAL DE NOMBRE -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>¿Con qué nombre quieres entrar?</h3>
      <input type="text" id="usernameInput" placeholder="Escribe tu nombre..." maxlength="20" />
      <button onclick="entrarAlChat()">Entrar al chat</button>
    </div>
  </div>

  <!-- HEADER -->
  <div class="header">
    <h2>Chat WebSocket</h2>
    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Desconectado</span>
    </div>
  </div>

  <!-- MENSAJES -->
  <div class="messages" id="messages"></div>

  <!-- INPUT -->
  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." disabled onkeypress="teclaEnter(event)" />
    <button id="sendBtn" onclick="enviar()" disabled>Enviar</button>
  </div>

  <script>
    const WS_URL = 'wss://websocket-server-rodrigo03-dev.apps.rm1.0a51.p1.openshiftapps.com';
    let socket;
    let miNombre = '';

    // Iniciales para el avatar
    function iniciales(nombre) {
      return nombre.trim().split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
    }

    // El usuario pone su nombre y se conecta
    function entrarAlChat() {
      const input = document.getElementById('usernameInput');
      const nombre = input.value.trim();
      if (!nombre) { input.focus(); return; }
      miNombre = nombre;
      document.getElementById('modalOverlay').style.display = 'none';
      conectar();
    }

    // Conectar al servidor WebSocket
    function conectar() {
      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        document.getElementById('statusDot').classList.add('online');
        document.getElementById('statusText').textContent = miNombre + ' — Conectado';
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        mensajeSistema('Conectado como ' + miNombre);
        // Avisar al servidor nuestro nombre
        socket.send(JSON.stringify({ tipo: 'nombre', nombre: miNombre }));
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'welcome') return; // ignorar bienvenida raw
          if (data.tipo === 'chat') {
            const esMio = data.nombre === miNombre;
            agregarBurbuja(data.nombre, data.texto, esMio);
          } else if (data.tipo === 'sistema') {
            mensajeSistema(data.texto);
          }
        } catch(e) {}
      };

      socket.onclose = () => {
        document.getElementById('statusDot').classList.remove('online');
        document.getElementById('statusText').textContent = 'Desconectado';
        document.getElementById('messageInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        mensajeSistema('Desconectado del servidor');
      };
    }

    // Enviar mensaje
    function enviar() {
      const input = document.getElementById('messageInput');
      const texto = input.value.trim();
      if (!texto || !socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ tipo: 'chat', nombre: miNombre, texto: texto }));
      input.value = '';
      input.focus();
    }

    function teclaEnter(e) {
      if (e.key === 'Enter') enviar();
    }

    // Agregar burbuja de mensaje
    function agregarBurbuja(nombre, texto, esMio) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'bubble' + (esMio ? ' mine' : '');
      div.innerHTML = `
        <div class="avatar">${iniciales(nombre)}</div>
        <div class="content">
          <div class="username">${nombre}</div>
          <div class="text">${texto}</div>
        </div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    // Mensaje del sistema
    function mensajeSistema(texto) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'sys-msg';
      div.textContent = texto;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    // Enter en el modal
    document.getElementById('usernameInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') entrarAlChat();
    });
  </script>
</body>
</html>
